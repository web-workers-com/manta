name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.7.8

      - name: Formatting
        run: cargo fmt --all --check

      - name: Translations
        run: python3 scripts/i18n/check.py

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Unit and UI tests without external services. Screenshot renders are
      # skipped (MANTA_RENDER_DIR is not set), so no GPU is needed.
      # Tests wait for events, not for times; the shared runners are slow, so
      # give background work more headroom before a wait gives up. One test
      # thread per vCPU (3 on macos-15) is libtest's default and stays.
      - name: Tests
        env:
          MANTA_TEST_WAIT_SECS: "120"
        run: scripts/test.sh
